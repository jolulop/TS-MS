name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tsms
          POSTGRES_USER: tsms
          POSTGRES_PASSWORD: tsms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsms -d tsms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TSMS_SECRET_KEY: ci-secret-key
      TSMS_DEBUG: "0"
      TSMS_ALLOWED_HOSTS: 127.0.0.1,localhost
      TSMS_DB_BACKEND: postgres
      TSMS_DB_NAME: tsms
      TSMS_DB_USER: tsms
      TSMS_DB_PASSWORD: tsms
      TSMS_DB_HOST: 127.0.0.1
      TSMS_DB_PORT: 5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -e .[dev]

      - name: Run Ruff lint
        run: make lint

      - name: Run Ruff format check
        run: make format-check

      - name: Verify migrations are up to date
        run: .venv/bin/python manage.py makemigrations --check

      - name: Run Django system checks
        run: make check

      - name: Apply migrations
        run: make migrate

      - name: Seed reference data
        run: make seed

      - name: Run tests
        run: make test
