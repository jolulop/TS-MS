{% extends "base.html" %}

{% block title %}{{ page_title }} | TS Management{% endblock %}

{% block content %}
  <div class="page-header">
    <p class="eyebrow">{{ page_eyebrow }}</p>
    <h1>{{ page_title }}</h1>
    <p>{{ page_intro }}</p>
  </div>

  <dl class="meta-grid">
    {% for label, value in profile_rows %}
      <div class="meta-row">
        <dt>{{ label }}</dt>
        <dd>{{ value }}</dd>
      </div>
    {% endfor %}
  </dl>
{% endblock %}
